apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-writer
  labels:
    app: metadata-writer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metadata-writer
  template:
    metadata:
      labels:
        app: metadata-writer
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Init container template: keep securityContext, resources, and script
      # in sync across all wait-for-* containers in this repo.
      initContainers:
      - name: wait-for-metadata-grpc
        image: docker.io/alpine:3.23
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        env:
        - name: WAIT_HOST
          value: metadata-grpc-service
        - name: WAIT_PORT
          value: "8080"
        command: ["/bin/sh", "-ec"]
        args:
          - |
            if [ -z "${WAIT_HOST}" ] || [ -z "${WAIT_PORT}" ]; then
              echo "ERROR: WAIT_HOST or WAIT_PORT is not set."
              exit 1
            fi

            # Install openssl for TLS health checks if needed
            if ! command -v openssl >/dev/null 2>&1; then
              apk add --no-cache openssl >/dev/null 2>&1 || echo "Warning: Could not install openssl, TLS checks unavailable"
            fi

            # Auto-detect TLS and plain TCP health check
            check_service() {
              # Check for known TLS services first (metadata-grpc uses TLS in cert-manager environments)
              if [ "${WAIT_PORT}" = "8080" ] && [ "${WAIT_HOST}" = "metadata-grpc-service" ]; then
                if command -v openssl >/dev/null 2>&1; then
                  if echo "" | timeout 5 openssl s_client -connect "${WAIT_HOST}:${WAIT_PORT}" -verify_return_error -connect_timeout 2 >/dev/null 2>&1; then
                    return 0
                  fi
                fi
              fi

              # Try plain TCP for all other cases or as fallback
              if nc -z -w 2 "${WAIT_HOST}" "${WAIT_PORT}" >/dev/null 2>&1; then
                return 0
              fi

              # Final fallback to TLS if openssl available
              if command -v openssl >/dev/null 2>&1; then
                echo "" | timeout 5 openssl s_client -connect "${WAIT_HOST}:${WAIT_PORT}" -verify_return_error -connect_timeout 2 >/dev/null 2>&1
              else
                return 1
              fi
            }

            while ! check_service; do
              i=$((i+1))
              if [ "$i" -ge "$MAX_RETRIES" ]; then
                echo "ERROR: Timed out waiting for ${WAIT_HOST}:${WAIT_PORT} after ${MAX_RETRIES} attempts."
                exit 1
              fi
              echo "Waiting for ${WAIT_HOST}:${WAIT_PORT} (attempt ${i}/${MAX_RETRIES})..."
              sleep 5
            done
      containers:
      - name: main
        image: ghcr.io/kubeflow/kfp-metadata-writer:dummy
        env:
        - name: NAMESPACE_TO_WATCH
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
      serviceAccountName: kubeflow-pipelines-metadata-writer
