apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ml-pipeline-scheduledworkflow
  name: ml-pipeline-scheduledworkflow
spec:
  selector:
    matchLabels:
      app: ml-pipeline-scheduledworkflow
  template:
    metadata:
      labels:
        app: ml-pipeline-scheduledworkflow
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Init container template: keep securityContext, resources, and script
      # in sync across all wait-for-* containers in this repo.
      initContainers:
      - name: wait-for-ml-pipeline
        image: docker.io/alpine:3.23
        securityContext:
          allowPrivilegeEscalation: false
          seccompProfile:
            type: RuntimeDefault
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
        env:
        - name: WAIT_HOST
          value: ml-pipeline
        - name: WAIT_PORT
          value: "8888"
        command: ["/bin/sh", "-ec"]
        args:
          - |
            if [ -z "${WAIT_HOST}" ] || [ -z "${WAIT_PORT}" ]; then
              echo "ERROR: WAIT_HOST or WAIT_PORT is not set."
              exit 1
            fi

            # Install openssl for TLS health checks if needed
            if ! command -v openssl >/dev/null 2>&1; then
              apk add --no-cache openssl >/dev/null 2>&1 || echo "Warning: Could not install openssl, TLS checks unavailable"
            fi

            # Auto-detect TLS and plain TCP health check
            check_service() {
              # Check for known TLS services first (ml-pipeline uses TLS in cert-manager environments)
              if [ "${WAIT_PORT}" = "8888" ] && [ "${WAIT_HOST}" = "ml-pipeline" ]; then
                if command -v openssl >/dev/null 2>&1; then
                  if echo "" | timeout 5 openssl s_client -connect "${WAIT_HOST}:${WAIT_PORT}" -verify_return_error -connect_timeout 2 >/dev/null 2>&1; then
                    return 0
                  fi
                fi
              fi

              # Try plain TCP for all other cases or as fallback
              if nc -z -w 2 "${WAIT_HOST}" "${WAIT_PORT}" >/dev/null 2>&1; then
                return 0
              fi

              # Final fallback to TLS if openssl available
              if command -v openssl >/dev/null 2>&1; then
                echo "" | timeout 5 openssl s_client -connect "${WAIT_HOST}:${WAIT_PORT}" -verify_return_error -connect_timeout 2 >/dev/null 2>&1
              else
                return 1
              fi
            }

            MAX_RETRIES=60; i=0
            while ! check_service; do
              i=$((i+1))
              if [ "$i" -ge "$MAX_RETRIES" ]; then
                echo "ERROR: Timed out waiting for ${WAIT_HOST}:${WAIT_PORT} after ${MAX_RETRIES} attempts."
                exit 1
              fi
              echo "Waiting for ${WAIT_HOST}:${WAIT_PORT} (attempt ${i}/${MAX_RETRIES})..."
              sleep 5
            done
      containers:
      - image: ghcr.io/kubeflow/kfp-scheduled-workflow-controller:dummy
        imagePullPolicy: IfNotPresent
        name: ml-pipeline-scheduledworkflow
        env:
          - name: METRICS_PORT
            value: "9090"
          - name: CLIENT_QPS
            value: "10"
          - name: "RESYNC_INTERVAL_SECONDS"
            value: "30"
          - name: CLIENT_BURST
            value: "20"
          - name: LOG_LEVEL
            value: "info"
          - name: NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace
          - name: CRON_SCHEDULE_TIMEZONE
            valueFrom:
              configMapKeyRef:
                name: pipeline-install-config
                key: cronScheduleTimezone
        ports:
          - name: http
            containerPort: 9090
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 0
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
          - mountPath: /var/run/secrets/kubeflow/tokens
            name: scheduledworkflow-sa-token
      serviceAccountName: ml-pipeline-scheduledworkflow
      volumes:
        - name: scheduledworkflow-sa-token
          projected:
            sources:
              - serviceAccountToken:
                  path: scheduledworkflow-sa-token
                  expirationSeconds: 3600
                  audience: pipelines.kubeflow.org
